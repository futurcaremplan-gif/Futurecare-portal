<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FutureCare Portal - Phase 1 Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f7f4;color:#222}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:430px;background:#fff;padding:30px;border-radius:18px;box-shadow:0 5px 25px #0002}
.logo{width:90px;height:90px;border-radius:50%;border:6px solid #07572e;color:#07572e;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;margin:0 auto 15px}
h2{text-align:center;color:#07572e;margin:8px 0}
.sub{text-align:center;color:#666;margin-bottom:20px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}
.roles button{padding:12px 5px;border:2px solid #07572e;background:#fff;color:#07572e;border-radius:8px;font-weight:bold;cursor:pointer}
.roles button.active{background:#07572e;color:#fff}
label{display:block;font-weight:bold;font-size:13px;margin-top:10px}
input{width:100%;padding:13px;margin-top:5px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.login-btn{width:100%;margin-top:18px;padding:13px;background:#07572e;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.error{color:#b00020;margin-top:12px;white-space:pre-wrap}
.info{background:#eef6f0;padding:12px;border-radius:8px;margin-top:12px;font-size:13px;color:#07572e}
</style>
</head>
<body>
<div class="login-page">
<div class="login-box">
<div class="logo">FUTURE<br>CARE</div>
<h2>FutureCare Portal</h2>
<div class="sub">Phase 1 — Secure Login</div>

<div class="roles">
<button id="ownerRole" class="active" type="button" onclick="selectRole('owner')">OWNER</button>
<button id="agentRole" type="button" onclick="selectRole('agent')">AGENT</button>
<button id="memberRole" type="button" onclick="selectRole('member')">MEMBER</button>
</div>

<label id="loginLabel">Owner Email</label>
<input id="loginValue" type="text" placeholder="futurcaremplan@gmail.com" autocomplete="username">

<label>Password</label>
<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button class="login-btn" type="button" onclick="login()">LOGIN</button>

<div id="error" class="error"></div>
<div id="info" class="info"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://sdxeiofegiqfldpugdqb.supabase.co";
const SUPABASE_KEY="sb_publishable_LFR3IVJkVTicyoEVm1KJwQ_FzogaNP-";
const OWNER_EMAIL="futurcaremplan@gmail.com";
let selectedRole="owner";

function selectRole(role){
  selectedRole=role;
  document.querySelectorAll(".roles button").forEach(b=>b.classList.remove("active"));
  document.getElementById(role+"Role").classList.add("active");
  const label=document.getElementById("loginLabel");
  const input=document.getElementById("loginValue");
  const info=document.getElementById("info");
  if(role==="owner"){
    label.textContent="Owner Email";
    input.placeholder=OWNER_EMAIL;
    info.textContent="Owner login uses the FutureCare Owner email and password.";
  }else if(role==="agent"){
    label.textContent="Agent ID";
    input.placeholder="Example: FCA00002WR";
    info.textContent="Agent login accepts IDs such as FCA00001KR or FCA00002WR.";
  }else{
    label.textContent="Client ID";
    input.placeholder="Example: FC00102062025";
    info.textContent="Member login uses Client ID and the member's Date Applied password.";
  }
  document.getElementById("error").textContent="";
}

async function signIn(email,password){
  const response=await fetch(
    SUPABASE_URL+"/auth/v1/token?grant_type=password",
    {
      method:"POST",
      headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    }
  );
  const data=await response.json();
  if(!response.ok) throw new Error(data.error_description||data.msg||"Login failed.");
  return data;
}

function memberPasswordToDate(value){
  if(!/^\d{8}$/.test(value)) throw new Error("Member password must be MMDDYYYY.");
  return value.substring(4,8)+"-"+value.substring(0,2)+"-"+value.substring(2,4);
}

async function login(){
  const value=document.getElementById("loginValue").value.trim();
  const password=document.getElementById("password").value.trim();
  const error=document.getElementById("error");
  error.textContent="";
  if(!value||!password){error.textContent="Please enter your login ID and password.";return;}

  try{
    if(selectedRole==="owner"){
      if(value.toLowerCase()!==OWNER_EMAIL.toLowerCase()) throw new Error("Please use the Owner email.");
      const data=await signIn(OWNER_EMAIL,password);
      localStorage.setItem("futurecare_access_token",data.access_token);
      localStorage.setItem("futurecare_role","owner");
      alert("OWNER LOGIN SUCCESSFUL");
      return;
    }

    if(selectedRole==="agent"){
      const agentCode=value.toUpperCase();
      if(!/^FCA\d+[A-Z]{2}$/.test(agentCode)){
        throw new Error("Invalid Agent ID. Example: FCA00002WR");
      }
      const email=agentCode.toLowerCase()+"@futurecare.local";
      const data=await signIn(email,password);
      localStorage.setItem("futurecare_access_token",data.access_token);
      localStorage.setItem("futurecare_role","agent");
      localStorage.setItem("futurecare_agent_code",agentCode);
      alert("AGENT LOGIN SUCCESSFUL");
      return;
    }

    const clientId=value.toUpperCase();
    if(!/^FC\d+$/i.test(clientId)) throw new Error("Invalid Client ID.");
    const dateApplied=memberPasswordToDate(password);

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/rpc/member_login",
      {
        method:"POST",
        headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
        body:JSON.stringify({p_client_id:clientId,p_date_applied:dateApplied})
      }
    );
    const result=await response.json();
    if(!response.ok) throw new Error(result.message||result.error||"Member account lookup failed.");

    let email="";
    if(typeof result==="string") email=result;
    else if(Array.isArray(result)&&result.length) email=result[0].member_login||result[0].email||result[0];
    else if(result&&typeof result==="object") email=result.member_login||result.email||"";
    if(!email) throw new Error("Member account was not found.");

    const data=await signIn(email,password);
    localStorage.setItem("futurecare_access_token",data.access_token);
    localStorage.setItem("futurecare_role","member");
    localStorage.setItem("futurecare_client_id",clientId);
    alert("MEMBER LOGIN SUCCESSFUL");
  }catch(e){
    error.textContent=e.message||"Login failed.";
  }
}

selectRole("owner");
</script>
</body>
</html>
