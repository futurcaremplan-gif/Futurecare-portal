<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FutureCare Member Dashboard</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}
header{
  background:#07572e;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0;font-size:22px}
.container{padding:18px;max-width:1600px;margin:auto}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}
.card h3{margin:0 0 8px;color:#666;font-size:14px}
.card strong{font-size:30px;color:#07572e}
.search{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  margin-bottom:15px;
}
.status{
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
}
.table-wrap{
  background:white;
  border-radius:12px;
  overflow:auto;
  box-shadow:0 2px 8px #0001;
}
table{
  border-collapse:collapse;
  width:100%;
  min-width:1000px;
}
th,td{
  border-bottom:1px solid #eee;
  padding:10px;
  text-align:left;
  white-space:nowrap;
}
th{
  background:#07572e;
  color:white;
  position:sticky;
  top:0;
}
tr:hover{background:#f5f5f5}
.error{
  color:#b00020;
  background:#ffecec;
  padding:15px;
  border-radius:8px;
}
.loading{
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <h1>FutureCare Member Dashboard</h1>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>TOTAL MEMBERS</h3>
      <strong id="totalMembers">0</strong>
    </div>

    <div class="card">
      <h3>RECORDS LOADED</h3>
      <strong id="recordsLoaded">0</strong>
    </div>
  </div>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search member, Client ID, agent, package..."
  >

  <div id="status" class="status">
    Connecting to Supabase...
  </div>

  <div id="error"></div>

  <div class="table-wrap">
    <div id="loading" class="loading">
      Loading FutureCare members...
    </div>

    <table id="membersTable" style="display:none">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://sdxeiofegiqfldpugdqb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LFR3IVJkVTicyoEVm1KJwQ_FzogaNP-";

const TABLE_NAME = "Plan_holders";

let allMembers = [];
let columns = [];

/* LOAD ALL MEMBERS */
async function loadMembers(){

  const status = document.getElementById("status");
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      TABLE_NAME +
      "?select=*",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

    if(!response.ok){
      const errorText = await response.text();
      throw new Error(
        "Supabase error " +
        response.status +
        ": " +
        errorText
      );
    }

    allMembers = await response.json();

    document.getElementById("totalMembers").textContent =
      allMembers.length;

    document.getElementById("recordsLoaded").textContent =
      allMembers.length;

    status.innerHTML =
      "✅ Connected to Supabase — " +
      allMembers.length +
      " member records loaded.";

    loading.style.display="none";

    if(allMembers.length === 0){
      status.innerHTML =
        "Connected, but no member records were returned.";
      return;
    }

    columns = Object.keys(allMembers[0]);

    buildHeader();
    displayMembers(allMembers);

    document.getElementById("membersTable").style.display="table";

  } catch(error){

    loading.style.display="none";

    errorBox.innerHTML =
      '<div class="error">' +
      '<strong>Unable to load members.</strong><br
