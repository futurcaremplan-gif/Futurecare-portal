<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FutureCare Owner Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#07572e;
  color:white;
  padding:22px 18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-inner{
  max-width:1500px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:28px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.logout{
  background:white;
  color:#07572e;
}

.container{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.status{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px #0001;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 2px 8px #0001;
}

.card h3{
  margin:0 0 10px;
  color:#666;
  font-size:18px;
}

.card strong{
  color:#07572e;
  font-size:34px;
}

.search{
  width:100%;
  padding:16px;
  border:2px solid #ccc;
  border-radius:10px;
  font-size:17px;
  margin-bottom:15px;
}

.table-wrap{
  background:white;
  border-radius:14px;
  overflow:auto;
  box-shadow:0 2px 8px #0001;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:900px;
}

th,td{
  border-bottom:1px solid #eee;
  padding:11px;
  text-align:left;
  white-space:nowrap;
}

th{
  background:#07572e;
  color:white;
  position:sticky;
  top:0;
}

tr:hover{
  background:#f5f5f5;
}

.view-btn{
  background:#07572e;
  color:white;
  padding:8px 12px;
  border-radius:7px;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 3px 15px #0002;
}

.login-box h2{
  color:#07572e;
  text-align:center;
}

.login-box input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.login-btn{
  width:100%;
  background:#07572e;
  color:white;
  margin-top:10px;
}

.error{
  color:#b00020;
  margin-top:12px;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  padding:20px;
  overflow:auto;
}

.modal-box{
  background:white;
  max-width:1000px;
  margin:30px auto;
  border-radius:15px;
  padding:22px;
}

.close{
  background:#eee;
  float:right;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  margin-top:20px;
}

.detail{
  background:#f4f7fb;
  padding:12px;
  border-radius:8px;
  word-break:break-word;
}

.detail b{
  display:block;
  color:#666;
  margin-bottom:5px;
}

.section-title{
  margin-top:25px;
  color:#07572e;
}

.loading{
  padding:30px;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

  <div class="login-box">

    <h2>FutureCare Owner</h2>

    <p style="text-align:center">
      Owner Dashboard Login
    </p>

    <input
      id="email"
      type="email"
      placeholder="Owner email"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="login-btn"
      onclick="login()"
    >
      LOGIN
    </button>

    <div id="loginError" class="error"></div>

  </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

<header>

  <div class="header-inner">

    <h1>FutureCare Owner Dashboard</h1>

    <button
      class="logout"
      onclick="logout()"
    >
      LOGOUT
    </button>

  </div>

</header>


<div class="container">

  <div id="status" class="status">
    Connecting to Supabase...
  </div>


  <div class="cards">

    <div class="card">
      <h3>TOTAL MEMBERS</h3>
      <strong id="totalMembers">0</strong>
    </div>

    <div class="card">
      <h3>RECORDS LOADED</h3>
      <strong id="recordsLoaded">0</strong>
    </div>

    <div class="card">
      <h3>TOTAL PAYMENTS</h3>
      <strong id="totalPayments">0</strong>
    </div>

    <div class="card">
      <h3>TOTAL PAYMENT AMOUNT</h3>
      <strong id="totalAmount">₱0</strong>
    </div>

  </div>


  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search member, Client ID, agent, package..."
    oninput="renderMembers()"
  >


  <div class="table-wrap">

    <div id="loading" class="loading">
      Loading FutureCare members...
    </div>

    <table id="membersTable" class="hidden">

      <thead id="tableHead"></thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

</div>


<!-- MEMBER MODAL -->
<div id="memberModal" class="modal hidden">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeModal()"
    >
      CLOSE
    </button>

    <h2 id="memberTitle">
      Member Details
    </h2>

    <div id="memberDetails" class="detail-grid"></div>

    <h2 class="section-title">
      Payment History
    </h2>

    <div class="table-wrap">

      <table>

        <thead id="paymentHead"></thead>

        <tbody id="paymentBody"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

/* =========================================================
   FUTURECARE SUPABASE SETTINGS
   ========================================================= */

const SUPABASE_URL =
"https://sdxeiofegiqfldpugdqb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LFR3IVJkVTicyoEVm1KJwQ_FzogaNP-";

const OWNER_EMAIL =
"futurcaremplan@gmail.com";

const MEMBERS_TABLE =
"plan_holders";

const PAYMENTS_TABLE =
"payments";


/* =========================================================
   VARIABLES
   ========================================================= */

let accessToken =
localStorage.getItem("futurecare_owner_token") || "";

let allMembers = [];

let allPayments = [];

let memberColumns = [];

let paymentColumns = [];


/* =========================================================
   SUPABASE REQUEST
   ========================================================= */

async function supabaseRequest(url, options={}){

  const headers = {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " +
      (accessToken || SUPABASE_KEY),

    "Content-Type":
      "application/json",

    ...(options.headers || {})

  };

  const response =
    await fetch(url,{
      ...options,
      headers
    });

  const text =
    await response.text();

  let data;

  try{
    data =
      text ? JSON.parse(text) : null;
  }catch{
    data = text;
  }

  if(!response.ok){

    throw new Error(
      typeof data === "object"
      ? JSON.stringify(data)
      : data
    );

  }

  return data;

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

  const email =
    document.getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document.getElementById("password")
      .value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if(!email || !password){

    error.textContent =
      "Please enter your email and password.";

    return;

  }

  if(email !== OWNER_EMAIL){

    error.textContent =
      "This login is for the FutureCare owner only.";

    return;

  }

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        "Login failed."
      );

    }

    accessToken =
      data.access_token;

    localStorage.setItem(
      "futurecare_owner_token",
      accessToken
    );

    document.getElementById(
      "loginPage"
    ).classList.add("hidden");

    document.getElementById(
      "dashboard"
    ).classList.remove("hidden");

    await loadDashboard();

  }catch(error){

    console.error(error);

    error =
      error.message || "Login failed.";

    document.getElementById(
      "loginError"
    ).textContent =
      error;

  }

}


/* =========================================================
   CHECK EXISTING LOGIN
   ========================================================= */

async function checkLogin(){

  if(!accessToken){

    return;

  }

  try{

    const user =
      await supabaseRequest(
        SUPABASE_URL +
        "/auth/v1/user"
      );

    if(
      !user ||
      !user.email ||
      user.email.toLowerCase() !== OWNER_EMAIL
    ){

      throw new Error("Not owner");

    }

    document.getElementById(
      "loginPage"
    ).classList.add("hidden");

    document.getElementById(
      "dashboard"
    ).classList.remove("hidden");

    await loadDashboard();

  }catch(error){

    localStorage.removeItem(
      "futurecare_owner_token"
    );

    accessToken = "";

  }

}


/* =========================================================
   LOAD ALL DATA
   ========================================================= */

async function loadDashboard(){

  const status =
    document.getElementById("status");

  const loading =
    document.getElementById("loading");

  try{

    status.textContent =
      "Loading members and payments...";

    loading.classList.remove("hidden");

    /*
      Load members.
      Supabase normally allows 1000 records per request.
      We use a large range because your current database
      has 558 members.
    */

    const membersUrl =
      SUPABASE_URL +
      "/rest/v1/" +
      MEMBERS_TABLE +
      "?select=*";

    allMembers =
      await supabaseRequest(
        membersUrl,
        {
          headers:{
            "Range":"0-9999"
          }
        }
      );

    if(!Array.isArray(allMembers)){

      allMembers = [];

    }


    /*
      Load payments.
    */

    const paymentsUrl =
      SUPABASE_URL +
      "/rest/v1/" +
      PAYMENTS_TABLE +
      "?select=*";

    allPayments =
      await supabaseRequest(
        paymentsUrl,
        {
          headers:{
            "Range":"0-9999"
          }
        }
      );

    if(!Array.isArray(allPayments)){

      allPayments = [];

    }


    /*
      Determine column order directly
      from Supabase response.
    */

    if(allMembers.length){

      memberColumns =
        Object.keys(allMembers[0]);

    }

    if(allPayments.length){

      paymentColumns =
        Object.keys(allPayments[0]);

    }


    /*
      Update dashboard numbers.
    */

    document.getElementById(
      "totalMembers"
    ).textContent =
      allMembers.length;

    document.getElementById(
      "recordsLoaded"
    ).textContent =
      allMembers.length;

    document.getElementById(
      "totalPayments"
    ).textContent =
      allPayments.length;


    let totalAmount = 0;

    for(const payment of allPayments){

      const amount =
        Number(payment.amount);

      if(Number.isFinite(amount)){

        totalAmount += amount;

      }

    }

    document.getElementById(
      "totalAmount"
    ).textContent =
      "₱" +
      totalAmount.toLocaleString(
        "en-PH",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );


    /*
      Build member table.
    */

    buildMemberHeader();

    renderMembers();

    loading.classList.add("hidden");

    document.getElementById(
      "membersTable"
    ).classList.remove("hidden");


    status.textContent =
      "✅ Connected to Supabase. " +
      allMembers.length +
      " member records loaded and " +
      allPayments.length +
      " payment records loaded.";

  }catch(error){

    console.error(error);

    loading.textContent =
      "Unable to load the FutureCare records.";

    status.innerHTML =
      "❌ Database loading error:<br><br>" +
      escapeHtml(error.message);

  }

}


/* =========================================================
   MEMBER TABLE HEADER
   ========================================================= */

function buildMemberHeader(){

  const head =
    document.getElementById(
      "tableHead"
    );

  head.innerHTML = "";

  const row =
    document.createElement("tr");

  for(const column of memberColumns){

    const th =
      document.createElement("th");

    th.textContent =
      column;

    row.appendChild(th);

  }

  const action =
    document.createElement("th");

  action.textContent =
    "ACTION";

  row.appendChild(action);

  head.appendChild(row);

}


/* =========================================================
   RENDER MEMBERS
   ========================================================= */

function renderMembers(){

  const body =
    document.getElementById(
      "tableBody"
    );

  body.innerHTML = "";

  const search =
    document.getElementById(
      "search"
    )
    .value
    .trim()
    .toLowerCase();


  const filtered =
    allMembers.filter(member => {

      if(!search){

        return true;

      }

      return Object.values(member)
        .some(value =>
          String(value ?? "")
            .toLowerCase()
            .includes(search)
        );

    });


  for(const member of filtered){

    const row =
      document.createElement("tr");


    for(const column of memberColumns){

      const td =
        document.createElement("td");

      td.textContent =
        member[column] ?? "";

      row.appendChild(td);

    }


    const actionTd =
      document.createElement("td");

    const button =
      document.createElement("button");

    button.className =
      "view-btn";

    button.textContent =
      "VIEW";

    button.onclick =
      () => viewMember(member);

    actionTd.appendChild(button);

    row.appendChild(actionTd);

    body.appendChild(row);

  }


  if(!filtered.length){

    const row =
      document.createElement("tr");

    const td =
      document.createElement("td");

    td.colSpan =
      memberColumns.length + 1;

    td.textContent =
      "No members found.";

    row.appendChild(td);

    body.appendChild(row);

  }

}


/* =========================================================
   VIEW MEMBER
   ========================================================= */

function viewMember(member){

  document.getElementById(
    "memberTitle"
  ).textContent =
    "Member Details";


  const details =
    document.getElementById(
      "memberDetails"
    );

  details.innerHTML = "";


  for(const column of memberColumns){

    const box =
      document.createElement("div");

    box.className =
      "detail";

    const label =
      document.createElement("b");

    label.textContent =
      column;

    const value =
      document.createElement("span");

    value.textContent =
      member[column] ?? "";

    box.appendChild(label);

    box.appendChild(value);

    details.appendChild(box);

  }


  /*
    Find this member's ID.
    Your payments table contains plan_holder_id.
  */

  const memberId =
    member.id;


  const memberPayments =
    allPayments.filter(payment => {

      return String(
        payment.plan_holder_id ?? ""
      ) === String(
        memberId ?? ""
      );

    });


  buildPaymentTable(
    memberPayments
  );


  document.getElementById(
    "memberModal"
  ).classList.remove("hidden");

}


/* =========================================================
   PAYMENT TABLE
   ========================================================= */

function buildPaymentTable(payments){

  const head =
    document.getElementById(
      "paymentHead"
    );

  const body =
    document.getElementById(
      "paymentBody"
    );

  head.innerHTML = "";

  body.innerHTML = "";


  if(!paymentColumns.length){

    const row =
      document.createElement("tr");

    const td =
      document.createElement("td");

    td.textContent =
      "No payment records found.";

    row.appendChild(td);

    body.appendChild(row);

    return;

  }


  const headRow =
    document.createElement("tr");


  for(const column of paymentColumns){

    const th =
      document.createElement("th");

    th.textContent =
      column;

    headRow.appendChild(th);

  }

  head.appendChild(headRow);


  if(!payments.length){

    const row =
      document.createElement("tr");

    const td =
      document.createElement("td");

    td.colSpan =
      paymentColumns.length;

    td.textContent =
      "No payment records found for this member.";

    row.appendChild(td);

    body.appendChild(row);

    return;

  }


  for(const payment of payments){

    const row =
      document.createElement("tr");


    for(const column of paymentColumns){

      const td =
        document.createElement("td");

      td.textContent =
        payment[column] ?? "";

      row.appendChild(td);

    }

    body.appendChild(row);

  }

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal(){

  document.getElementById(
    "memberModal"
  ).classList.add("hidden");

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

  try{

    if(accessToken){

      await fetch(
        SUPABASE_URL +
        "/auth/v1/logout",
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " +
              accessToken
          }
        }
      );

    }

  }catch(error){

    console.error(error);

  }

  localStorage.removeItem(
    "futurecare_owner_token"
  );

  accessToken = "";

  location.reload();

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   START
   ========================================================= */

checkLogin();

</script>

</body>
  </html>
