<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FutureCare Owner Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}

header{
  background:#07572e;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  margin:0;
  font-size:24px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 18px;
  font-size:15px;
  cursor:pointer;
}

.logout{
  background:white;
  color:#07572e;
  font-weight:bold;
}

.container{
  padding:18px;
  max-width:1600px;
  margin:auto;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 2px 12px #0002;
}

.login-box h2{
  color:#07572e;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.login-btn{
  width:100%;
  background:#07572e;
  color:white;
  font-weight:bold;
  margin-top:10px;
}

.message{
  padding:15px;
  border-radius:8px;
  margin-bottom:15px;
  background:white;
}

.error{
  color:#b00020;
  background:#ffecec;
}

.success{
  color:#07572e;
  background:#eafff1;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

.card h3{
  margin:0 0 8px;
  color:#666;
}

.card strong{
  font-size:30px;
  color:#07572e;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
  margin-bottom:15px;
}

.table-wrap{
  background:white;
  border-radius:12px;
  overflow:auto;
  box-shadow:0 2px 8px #0001;
}

table{
  border-collapse:collapse;
  width:100%;
  min-width:1000px;
}

th,td{
  border-bottom:1px solid #eee;
  padding:10px;
  text-align:left;
  white-space:nowrap;
}

th{
  background:#07572e;
  color:white;
  position:sticky;
  top:0;
}

tr:hover{
  background:#f5f5f5;
}
